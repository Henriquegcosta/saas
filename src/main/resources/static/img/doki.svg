<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Doki">
  <!-- Doki: robô amigável com escudo (proteção) e olhos atentos ("está de olho") -->
  <defs>
    <linearGradient id="doki-a" x1="10" y1="10" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- antena -->
  <path d="M32 6v7" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="3.5" fill="#BFDBFE"/>
  <!-- orelhas -->
  <rect x="4" y="27" width="6" height="13" rx="3" fill="#1E40AF"/>
  <rect x="54" y="27" width="6" height="13" rx="3" fill="#1E40AF"/>
  <!-- cabeça -->
  <rect x="9" y="13" width="46" height="41" rx="15" fill="url(#doki-a)"/>
  <!-- visor -->
  <rect x="15" y="21" width="34" height="24" rx="10" fill="#0B1F3A"/>
  <!-- olhos -->
  <ellipse cx="25" cy="31" rx="4.6" ry="5.2" fill="#fff"/>
  <ellipse cx="39" cy="31" rx="4.6" ry="5.2" fill="#fff"/>
  <circle cx="26" cy="32" r="2.4" fill="#2563EB"/>
  <circle cx="40" cy="32" r="2.4" fill="#2563EB"/>
  <circle cx="26.9" cy="30.9" r=".9" fill="#fff"/>
  <circle cx="40.9" cy="30.9" r=".9" fill="#fff"/>
  <!-- sorriso -->
  <path d="M27 39.5c2.8 2.2 7.2 2.2 10 0" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
  <!-- escudo de proteção -->
  <path d="M50 42l-7 2.6v4.6c0 4 2.9 6.9 7 8.3 4.1-1.4 7-4.3 7-8.3v-4.6L50 42Z" fill="#16A34A" stroke="#fff" stroke-width="1.6"/>
  <path d="M47 49.6l2.1 2.1 4-4.2" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
