<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/auth :: auth(~{::title}, ~{::#conteudo}, ~{})}">
<head><title>Nova senha · VIGENTRA</title></head>
<body>
<div id="conteudo" class="auth-card fade-up">
    <h1>Criar nova senha</h1>

    <div th:unless="${tokenValido}">
        <div class="alert alert-warning d-flex gap-2 mt-3"><i class="bi bi-exclamation-triangle-fill"></i>
            <span>Este link é inválido, já foi utilizado ou expirou.</span></div>
        <a class="btn btn-primary w-100" th:href="@{/recuperar-senha}">Solicitar novo link</a>
    </div>

    <form th:if="${tokenValido}" th:action="@{/redefinir-senha}" th:object="${form}" method="post" class="needs-validation mt-3" novalidate>
        <p class="sub">Escolha uma senha forte que você não utilize em outros serviços.</p>
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger d-flex gap-2">
            <i class="bi bi-exclamation-circle-fill"></i>
            <div><p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div>
        </div>
        <input type="hidden" th:field="*{token}">
        <div class="mb-3">
            <label class="form-label" for="novaSenha">Nova senha</label>
            <div class="input-password">
                <input class="form-control" id="novaSenha" type="password" th:field="*{novaSenha}" required minlength="8" maxlength="72"
                       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,72}" autocomplete="new-password" data-strength
                       th:classappend="${#fields.hasErrors('novaSenha')} ? 'is-invalid'">
                <button class="toggle-password" type="button" aria-label="Mostrar senha"><i class="bi bi-eye"></i></button>
                <div class="invalid-feedback">Mínimo de 8 caracteres com maiúscula, minúscula e número.</div>
            </div>
            <div class="password-meter"><span></span></div>
            <div class="form-text password-label"></div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="confirmacao">Confirmar nova senha</label>
            <div class="input-password">
                <input class="form-control" id="confirmacao" type="password" th:field="*{confirmacao}" required data-match="novaSenha"
                       autocomplete="new-password" th:classappend="${#fields.hasErrors('confirmacao')} ? 'is-invalid'">
                <button class="toggle-password" type="button" aria-label="Mostrar senha"><i class="bi bi-eye"></i></button>
                <div class="invalid-feedback">As senhas não conferem.</div>
            </div>
        </div>
        <button class="btn btn-primary w-100 btn-lg" type="submit">Salvar nova senha</button>
    </form>
</div>
</body>
</html>
