<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout('#16A34A', ~{::corpo})}">
<body>
<div th:fragment="corpo">
    <h1 style="margin:0 0 14px;font-size:21px;line-height:1.3;color:#0B1F3A">&#9989; O envio de e-mails está funcionando</h1>
    <p style="margin:0 0 14px">Olá, <strong th:text="${nome}">Nome</strong>. Esta é uma mensagem de teste da empresa
        <strong th:text="${empresaNome}">Empresa</strong>. Se você a recebeu, os alertas de vencimento serão entregues normalmente.</p>
    <p style="margin:0;font-size:13px;color:#64748B">Serviço utilizado: <span th:text="${provedor}">provedor</span></p>
    <p th:if="${assinatura != ''}" style="margin:16px 0 0;font-size:13px;color:#334155;white-space:pre-line" th:text="${assinatura}"></p>
</div>
</body>
</html>
