<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout('#DC2626', ~{::corpo})}">
<body>
<div th:fragment="corpo">
    <p style="margin:0 0 6px;font-size:12px;color:#DC2626;text-transform:uppercase;letter-spacing:1px;font-weight:700"
       th:text="${periodoLabel}">Após o vencimento</p>
    <h1 style="margin:0 0 14px;font-size:22px;line-height:1.3;color:#0B1F3A">Documento <span style="color:#DC2626">vencido</span></h1>
    <p style="margin:0 0 18px">Olá, <strong th:text="${destinatarioNome}">responsável</strong>. O documento abaixo, da empresa
        <strong th:text="${empresaNome}">Empresa</strong>, já passou da data de validade e precisa de atenção.</p>
    <table th:replace="~{email/alerta-detalhes :: detalhes('#DC2626')}"></table>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:16px;border:1px solid #FECACA;border-radius:10px;background:#FEF2F2">
        <tr><td style="padding:12px 16px;font-size:13px;color:#991B1B">
            Documentos vencidos podem gerar multas, interdições ou impedir contratos. Providencie a renovação o quanto antes.
        </td></tr>
    </table>
    <table th:replace="~{email/botao :: botao(${baseUrl} + '/app/documentos/' + ${documentoId}, 'Ver documento e registrar renovação', '#DC2626')}"></table>
    <p th:if="${assinatura}" style="margin:0;font-size:13px;color:#334155;white-space:pre-line" th:text="${assinatura}"></p>
</div>
</body>
</html>
