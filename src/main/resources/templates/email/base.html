<!DOCTYPE html>
<!--/*
  Layout base de TODOS os e-mails do VIGENTRA (identidade visual única).
  Uso: <html th:replace="~{email/base :: layout('#2563EB', ~{::corpo})}"> ... <div th:fragment="corpo">...</div>
  Variáveis opcionais do contexto: preheader, empresaNome, rodape, linkPreferencias, linkDescadastro.
  Tabelas + estilos inline: é o que funciona de forma consistente em Gmail, Outlook e Apple Mail.
*/-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(destaque, corpo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title th:text="${preheader} ?: 'VIGENTRA'">VIGENTRA</title>
    <style>
        @media (max-width: 620px) {
            .dg-container { width: 100% !important; border-radius: 0 !important; }
            .dg-px { padding-left: 20px !important; padding-right: 20px !important; }
            .dg-btn { display: block !important; text-align: center !important; }
        }
        a { color: #2563EB; }
    </style>
</head>
<body style="margin:0;padding:0;background:#EEF2F7;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent" th:text="${preheader}"></div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EEF2F7;padding:28px 12px">
    <tr><td align="center">
        <table role="presentation" class="dg-container" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #E2E8F0">
            <!-- Cabeçalho -->
            <tr><td class="dg-px" style="background:#0B1F3A;padding:22px 32px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
                    <td style="vertical-align:middle">
                        <span style="display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:8px;background:#2563EB;color:#ffffff;font-weight:700;font-size:15px;vertical-align:middle">&#10003;</span>
                        <span style="color:#ffffff;font-size:19px;font-weight:700;letter-spacing:-.3px;vertical-align:middle;margin-left:8px">VIGENTRA</span>
                    </td>
                    <td align="right" style="vertical-align:middle;color:#93A8C6;font-size:12px" th:if="${empresaNome}" th:text="${empresaNome}">Empresa</td>
                </tr></table>
            </td></tr>
            <tr><td th:style="'height:4px;line-height:4px;font-size:0;background:' + ${destaque}" style="height:4px;background:#2563EB">&nbsp;</td></tr>
            <!-- Conteúdo -->
            <tr><td class="dg-px" style="padding:30px 32px 26px;font-size:15px;line-height:1.6;color:#334155">
                <div th:replace="${corpo}"></div>
            </td></tr>
            <!-- Rodapé -->
            <tr><td class="dg-px" style="padding:18px 32px 22px;border-top:1px solid #E2E8F0;background:#F8FAFC;font-size:11.5px;line-height:1.6;color:#94A3B8">
                <span th:text="${rodape} ?: 'Mensagem automática do VIGENTRA - Gestão de validade de documentos e certificados. Não responda a este e-mail.'"></span>
                <span th:if="${linkPreferencias}"><br>
                    <a th:href="${linkPreferencias}" style="color:#64748B">Gerenciar preferências de comunicação</a>
                    <span th:if="${linkDescadastro}"> · <a th:href="${linkDescadastro}" style="color:#64748B">Não receber mais estes e-mails</a></span>
                </span>
                <br>Tratamos seus dados conforme a LGPD (Lei 13.709/2018).
            </td></tr>
        </table>
        <p style="margin:16px 0 0;font-size:11px;color:#94A3B8">© VIGENTRA</p>
    </td></tr>
</table>
</body>
</html>
