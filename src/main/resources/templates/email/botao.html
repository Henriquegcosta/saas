<!DOCTYPE html>
<!--/* Botão de chamada para ação reutilizável nos e-mails */-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<table th:fragment="botao(link, texto, cor)" role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0">
    <tr><td th:style="'border-radius:10px;background:' + ${cor}" style="border-radius:10px;background:#2563EB">
        <a class="dg-btn" th:href="${link}" th:text="${texto}"
           style="display:inline-block;padding:13px 28px;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;border-radius:10px">Ação</a>
    </td></tr>
</table>
<p th:fragment="linkAlternativo(link)" style="margin:0;font-size:12px;line-height:1.5;color:#94A3B8">
    Se o botão não funcionar, copie e cole este endereço no navegador:<br>
    <span style="word-break:break-all;color:#64748B" th:text="${link}"></span>
</p>
</body>
</html>
