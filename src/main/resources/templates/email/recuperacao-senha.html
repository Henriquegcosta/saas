<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout('#2563EB', ~{::corpo})}">
<body>
<div th:fragment="corpo">
    <h1 style="margin:0 0 14px;font-size:22px;line-height:1.3;color:#0B1F3A">Redefinição de senha</h1>
    <p style="margin:0 0 12px">Olá, <strong th:text="${nome}">Nome</strong>.</p>
    <p style="margin:0">Recebemos uma solicitação para redefinir a senha da sua conta. Para criar uma nova senha, clique no botão:</p>
    <table th:replace="~{email/botao :: botao(${link}, 'Criar nova senha', '#2563EB')}"></table>
    <p style="margin:0 0 18px;font-size:13px;color:#64748B">O link vale por <strong th:text="${minutos}">30</strong> minutos e pode ser usado
        uma única vez. Se você não pediu a redefinição, ignore este e-mail — sua senha atual continua válida.</p>
    <p th:replace="~{email/botao :: linkAlternativo(${link})}"></p>
</div>
</body>
</html>
